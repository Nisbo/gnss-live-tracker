name: V2 build and host checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v2:
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:v5.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trust checkout ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build V2 only
        shell: bash
        run: |
          set -euo pipefail
          . /opt/esp/idf/export.sh
          idf.py build
      - name: Host-only checks (no device or radio)
        shell: bash
        run: |
          set -euo pipefail
          . /opt/esp/idf/export.sh
          python scripts/test-v2.py
      - name: Create matching installation and OTA package
        shell: bash
        run: |
          set -euo pipefail
          . /opt/esp/idf/export.sh
          python scripts/package-release.py
          python scripts/export-source.py dist/gnss-live-tracker-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gnss-live-tracker-v2-candidate
          path: |
            dist/
            .test-output/host-tests.json
          if-no-files-found: error
